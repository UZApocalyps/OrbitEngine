[package]
name = "xtask"
description = "Workspace automation: cargo xtask <web|serve|templates|wasm-budget|check-arch|gen-assets|plugins|plugin-key|plugin-index>"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit_export.workspace = true
image.workspace = true
hound.workspace = true
brotli = "9.0.0"
serde_json = "1"
# `cargo xtask plugins`: the .orbitplugin packages (zip + manifest.ron).
serde.workspace = true
ron.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Plugin store: signed build descriptors, catalogs, key generation.
orbit_plugin_store.workspace = true
orbit_sign.workspace = true
getrandom = "0.3"

[lints]
workspace = true
