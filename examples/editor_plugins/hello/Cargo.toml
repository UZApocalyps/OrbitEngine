[package]
name = "orbit_hello_plugin"
description = "Example native editor plugin (plugin SDK template): a window, a Tools menu action that adds a note to the project, a settings page and its own texts."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# A native editor plugin is a C-ABI dynamic library.
crate-type = ["cdylib"]

[dependencies]
# The only dependency a plugin needs: the editor API, the editor's egui, the
# project crates, and the editor's dependency resolution. Out of this
# repository, take it from the editor's git tag and copy the editor's
# Cargo.lock next to your Cargo.toml:
# orbit_editor_sdk = { git = "https://github.com/<owner>/OrbitEngine", tag = "v0.4.0" }
orbit_editor_sdk.workspace = true

# `export_plugin!` generates `#[no_mangle]` functions: `unsafe_code` may be
# denied but not forbidden (the workspace forbids it).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
