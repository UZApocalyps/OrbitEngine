name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev \
            libgl1-mesa-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  # Player templates: what an export glues a game to (docs/adr/0010). Native
  # players are built on their own OS (no cross-compilation); the web player on
  # Linux, with wasm-opt, and the wasm size budget fails the job when exceeded.
  templates:
    name: player templates ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --no-web
          - os: ubuntu-latest
            args: --check-budget
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev             libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev             libgl1-mesa-dev pkg-config
      - name: Install wasm-bindgen CLI matching Cargo.lock and wasm-opt (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
          cargo install wasm-opt --locked
      - name: Build the templates (and check the wasm size budget)
        run: cargo xtask templates ${{ matrix.args }}
      - name: Size report (twiggy, informational)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          cargo install twiggy --locked
          twiggy top -n 25 target/templates/web/orbit_player_bg.wasm | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: templates-${{ runner.os }}
          path: target/templates
          if-no-files-found: error

  # The exports of the demo, for every target, with the real templates.
  export-e2e:
    name: export end to end
    needs: templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: templates-*
          path: target/templates
          merge-multiple: true
      - name: Export the demo for every target
        shell: bash
        run: |
          mkdir -p demo-project/i18n demo-project/assets
          cp examples/stories/demo.ron demo-project/story.ron
          cp examples/stories/i18n/demo.fr.ron demo-project/i18n/story.fr.ron
          cp -r assets/demo demo-project/assets/demo
          printf '(format: 1, name: "Demo", story: "story.ron")
' > demo-project/orbit.project.ron
          cargo run -p orbit_cli -- export all --project demo-project --out dist --templates target/templates
          ls -R dist | head -50
          test -f dist/demo-1.0.0-windows.zip
          test -f dist/demo-1.0.0-linux.tar.gz
          test -f dist/demo-1.0.0-web/game.pak
      - name: Run the exported Linux player (software Vulkan, virtual display)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0
          mkdir -p clean && tar xzf dist/demo-1.0.0-linux.tar.gz -C clean
          cd clean/Demo
          timeout 15 xvfb-run -a ./demo --new-game --data-dir ../data 2> ../run.log || true
          cat ../run.log
          grep -q "story \`Demo\` ready" ../run.log
          ! grep -q panicked ../run.log
      - uses: actions/upload-artifact@v4
        with:
          name: demo-exports
          path: dist

  editor:
    name: editor ${{ matrix.os }}
    needs: templates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev             libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev             libgl1-mesa-dev pkg-config
      - name: Clippy (editor and plugin APIs)
        run: cargo clippy -p orbit_editor -p orbit_editor_api -p orbit_plugin_api --all-targets -- -D warnings
      - name: "Tests (headless, no window and no GPU)"
        run: cargo test -p orbit_editor -p orbit_editor_api -p orbit_plugin_api
      - name: Build (release)
        run: cargo build --release -p orbit_editor
      - uses: actions/download-artifact@v4
        with:
          pattern: templates-*
          path: packaging/templates
          merge-multiple: true
      - name: Portable archive
        shell: bash
        run: |
          mkdir -p dist/orbit-editor/assets
          cp -r packaging/templates dist/orbit-editor/templates
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/orbit-editor.exe dist/orbit-editor/
          else
            cp target/release/orbit-editor dist/orbit-editor/
          fi
          cp -r examples dist/orbit-editor/
          cp -r assets/demo dist/orbit-editor/assets/
          cp README.md dist/orbit-editor/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../orbit-editor-windows.zip orbit-editor
          else
            tar czf ../orbit-editor-linux.tar.gz orbit-editor
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-editor-${{ runner.os }}
          path: |
            orbit-editor-windows.zip
            orbit-editor-linux.tar.gz
          if-no-files-found: error

  # Installers: MSI + NSIS (Windows), AppImage + deb (Linux), built with
  # cargo-packager. On a `v*` tag or by hand; never pushes a tag: the GitHub
  # Release stays a draft until the maintainer publishes it.
  release:
    name: installers ${{ matrix.os }}
    needs: templates
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: wix,nsis
          - os: ubuntu-latest
            formats: appimage,deb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev             libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev             libgl1-mesa-dev pkg-config libfuse2 file desktop-file-utils
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build the editor (release)
        run: cargo build --release -p orbit_editor
      # The installers ship `templates/` next to the editor (packaging/templates).
      - uses: actions/download-artifact@v4
        with:
          pattern: templates-*
          path: packaging/templates
          merge-multiple: true
      - name: Build the installers
        working-directory: crates/orbit_editor
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            target/packager/*.msi
            target/packager/*-setup.exe
            target/packager/*.AppImage
            target/packager/*.deb
          if-no-files-found: error

  release-draft:
    name: draft GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Release tag name (the pushed tag, or v<workspace version> by hand)
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
            echo "name=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: installers/*

  wasm:
    name: wasm32 (WebGL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build player for wasm32
        run: cargo build -p orbit_player --target wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Web bundle (development: RON story and loose files)
        run: cargo xtask web
      - name: "Architecture check (core crates and plugin API without GPU, window or egui; wasm32 build; the player never links the editor)"
        run: cargo xtask check-arch
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: target/web

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
