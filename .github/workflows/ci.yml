name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev \
            libgl1-mesa-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace

  editor:
    name: editor ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev             libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev             libgl1-mesa-dev pkg-config
      - name: Clippy (editor and plugin APIs)
        run: cargo clippy -p orbit_editor -p orbit_editor_api -p orbit_plugin_api --all-targets -- -D warnings
      - name: "Tests (headless, no window and no GPU)"
        run: cargo test -p orbit_editor -p orbit_editor_api -p orbit_plugin_api
      - name: Build (release)
        run: cargo build --release -p orbit_editor
      - name: Portable archive
        shell: bash
        run: |
          mkdir -p dist/orbit-editor/assets
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/orbit-editor.exe dist/orbit-editor/
          else
            cp target/release/orbit-editor dist/orbit-editor/
          fi
          cp -r examples dist/orbit-editor/
          cp -r assets/demo dist/orbit-editor/assets/
          cp README.md dist/orbit-editor/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../orbit-editor-windows.zip orbit-editor
          else
            tar czf ../orbit-editor-linux.tar.gz orbit-editor
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-editor-${{ runner.os }}
          path: |
            orbit-editor-windows.zip
            orbit-editor-linux.tar.gz
          if-no-files-found: error

  # Installers: MSI + NSIS (Windows), AppImage + deb (Linux), built with
  # cargo-packager. On a `v*` tag or by hand; never pushes a tag: the GitHub
  # Release stays a draft until the maintainer publishes it.
  release:
    name: installers ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: wix,nsis
          - os: ubuntu-latest
            formats: appimage,deb
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev             libxkbcommon-x11-dev libwayland-dev libvulkan-dev libegl1-mesa-dev             libgl1-mesa-dev pkg-config libfuse2 file desktop-file-utils
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked
      - name: Build the editor (release)
        run: cargo build --release -p orbit_editor
      - name: Build the installers
        working-directory: crates/orbit_editor
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            target/packager/*.msi
            target/packager/*-setup.exe
            target/packager/*.AppImage
            target/packager/*.deb
          if-no-files-found: error

  release-draft:
    name: draft GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Release tag name (the pushed tag, or v<workspace version> by hand)
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
            echo "name=v$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: true
          files: installers/*

  wasm:
    name: wasm32 (WebGL2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build player for wasm32
        run: cargo build -p orbit_player --target wasm32-unknown-unknown
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          VERSION=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Web bundle
        run: cargo xtask web
      - name: "Architecture check (core crates and plugin API without GPU, window or egui; wasm32 build; the player never links the editor)"
        run: cargo xtask check-arch
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: target/web

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
