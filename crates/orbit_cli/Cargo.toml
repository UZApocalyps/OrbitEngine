[package]
name = "orbit_cli"
description = "OrbitEngine command line: validate stories and play them in the terminal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
orbit_core.workspace = true
orbit_vm.workspace = true
orbit_save.workspace = true
# `orbit mcp`: the stdio transport (tokio, rmcp).
orbit_mcp = { workspace = true, features = ["server"] }
orbit_project.workspace = true
orbit_script.workspace = true
orbit_export.workspace = true
orbit_i18n.workspace = true
orbit_renpy.workspace = true

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
