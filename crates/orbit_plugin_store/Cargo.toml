[package]
name = "orbit_plugin_store"
description = "OrbitEngine editor plugin store: catalog format (index.json), sources and trust levels, Ed25519-signed builds, cached catalog fetching, verified downloads, update detection. No egui: also used by `cargo xtask` to sign builds and write catalogs. Editor only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit_sign.workspace = true
orbit_http.workspace = true
serde.workspace = true
serde_json = "1"
ron.workspace = true
# Game plugin source packages (`game::package`): read, checked, extracted.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The game plugin end-to-end test packs `examples/plugins/dice` for this API.
orbit_plugin_api.workspace = true
# The editor build id must be computed the same way from the editor's facts
# and from a probed plugin's fingerprint (JSON).
orbit_plugin_host.workspace = true
orbit_editor_api.workspace = true

[lints]
workspace = true
