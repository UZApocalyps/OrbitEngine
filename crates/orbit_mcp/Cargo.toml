[package]
name = "orbit_mcp"
description = "OrbitEngine MCP server (headless, stdio): lets an AI client read and edit a project through orbit_project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit_core = { workspace = true, features = ["schema"] }
orbit_project.workspace = true
orbit_anim.workspace = true
orbit_assets.workspace = true
orbit_dsl.workspace = true
orbit_ui_data.workspace = true
# glTF import: reads the skeleton of rigged models for the pose ops.
orbit_scene = { path = "../orbit_scene", default-features = false, features = ["gltf-import"] }
ron.workspace = true
orbit_plugin_api.workspace = true
orbit_vm.workspace = true
orbit_script.workspace = true
orbit_i18n.workspace = true
orbit_layers.workspace = true
# The transports (feature `server`): stdio (`orbit mcp`) and the live HTTP
# server of the `orbit.mcp` editor plugin. Without the feature the crate is the
# tools alone (definitions, dispatch, the project host), with no async runtime
# and no network: what the editor links.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"], optional = true }
tokio = { version = "1", features = ["rt", "io-std", "sync", "net", "time", "macros"], optional = true }
# Live mode: the HTTP side of the streamable transport (rmcp provides a tower
# service, not a listener).
hyper = { version = "1", default-features = false, features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
tokio-util = { version = "0.7", optional = true }
base64.workspace = true
getrandom = "0.3"
serde.workspace = true
serde_json = "1"
schemars = "1.2"
thiserror.workspace = true
# PNG encoding of the pictures written by `rig_cut` (already in the tree
# through orbit_assets' decoder).
image.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# The MCP transports: `server` (stdio, rmcp) and `live::LiveServer` (HTTP).
# Enabled by `orbit_cli` and the `orbit.mcp` editor plugin, never by the editor.
server = ["dep:rmcp", "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:tokio-util"]

[lints]
workspace = true
