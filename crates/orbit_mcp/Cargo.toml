[package]
name = "orbit_mcp"
description = "OrbitEngine MCP server (headless, stdio): lets an AI client read and edit a project through orbit_project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit_core = { workspace = true, features = ["schema"] }
orbit_project.workspace = true
orbit_anim.workspace = true
orbit_assets.workspace = true
orbit_dsl.workspace = true
orbit_ui_data.workspace = true
orbit_scene = { path = "../orbit_scene", default-features = false }
ron.workspace = true
orbit_plugin_api.workspace = true
orbit_vm.workspace = true
orbit_script.workspace = true
orbit_i18n.workspace = true
orbit_layers.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt", "io-std", "sync", "net", "time", "macros"] }
# Live mode: the HTTP side of the streamable transport (rmcp provides a tower
# service, not a listener).
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio-util = "0.7"
base64.workspace = true
getrandom = "0.3"
serde.workspace = true
serde_json = "1"
schemars = "1.2"
thiserror.workspace = true

[dev-dependencies]
image.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true
