[package]
name = "orbit_mcp"
description = "OrbitEngine MCP server (headless, stdio): lets an AI client read and edit a project through orbit_project."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit_core = { workspace = true, features = ["schema"] }
orbit_project.workspace = true
orbit_plugin_api.workspace = true
orbit_vm.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "sync"] }
serde.workspace = true
serde_json = "1"
schemars = "1.2"
thiserror.workspace = true

[lints]
workspace = true
