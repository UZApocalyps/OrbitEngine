[package]
name = "orbit_platform"
description = "OrbitEngine platform layer: window + application loop on winit, native and web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
winit.workspace = true
web-time.workspace = true
log.workspace = true
thiserror.workspace = true
sys-locale.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs.workspace = true
pollster.workspace = true
image.workspace = true
time.workspace = true

# Android (ADR 0017): GameActivity entry point through `android-activity`,
# re-exported by winit as `winit::platform::android::activity`.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-game-activity"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement", "EventTarget", "Event"] }
wasm-bindgen.workspace = true
js-sys.workspace = true

[lints]
workspace = true
