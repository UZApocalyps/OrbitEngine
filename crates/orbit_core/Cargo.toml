[package]
name = "orbit_core"
description = "OrbitEngine core IR: stable IDs, values, story model, RON loading and validation. No graphics or platform dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
ron.workspace = true
ulid.workspace = true
thiserror.workspace = true
web-time.workspace = true
getrandom = "0.4"
schemars = { version = "1.2", optional = true }

[features]
# JSON Schema of the IR (used by the MCP server, and by the tests that keep it
# coherent with the editor's schema-driven inspector).
schema = ["dep:schemars"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
