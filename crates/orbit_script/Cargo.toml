[package]
name = "orbit_script"
description = "OrbitEngine scripting (ADR 0015): a sandboxed Rhai engine behind the VM's ScriptHost hook. Pure Rust, no I/O, no clock; compiles to wasm."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit_core.workspace = true
orbit_vm.workspace = true
# Sandbox (ADR 0015 §1/§3): no clock (`no_time`), engine shared between the
# VMs of a game (`sync`), no custom syntax.
rhai = { version = "1", default-features = false, features = ["std", "sync", "no_time", "no_custom_syntax"] }

[dev-dependencies]
orbit_save.workspace = true

[lints]
workspace = true
