[package]
name = "orbit_plugin_host"
description = "OrbitEngine editor, native plugin host: verifies (file format, descriptor, build fingerprint, editor range, checksum), installs / uninstalls and loads the editor plugin libraries (DLL / .so / .dylib). Editor only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
orbit_editor_api.workspace = true
orbit_plugin_api.workspace = true
libloading.workspace = true
serde.workspace = true
serde_json = "1"
ron.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
log.workspace = true

# Loading a library is `unsafe`: this crate is the only editor crate allowed
# to, and only in `src/load.rs` (everything else stays `deny`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
