[package]
name = "orbit_runtime"
description = "OrbitEngine runtime: orchestrates the story VM, assets, 2D rendering, text, audio and in-game UI. Independent of the player binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
accesskit.workspace = true
orbit_core.workspace = true
orbit_vm.workspace = true
orbit_platform.workspace = true
orbit_render2d.workspace = true
orbit_text.workspace = true
orbit_audio.workspace = true
orbit_assets.workspace = true
orbit_ui.workspace = true
orbit_save.workspace = true
orbit_i18n.workspace = true
orbit_pak.workspace = true
image.workspace = true
log.workspace = true
thiserror.workspace = true
orbit_render3d = { workspace = true, optional = true }

[features]
# 3D scenes (ADR 0014). Off by default: 2D-only builds and wasm stay unchanged.
3d = ["dep:orbit_render3d"]

[lints]
workspace = true
