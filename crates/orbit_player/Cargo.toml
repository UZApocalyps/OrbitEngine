[package]
name = "orbit_player"
description = "OrbitEngine player: opens a window (or canvas) and plays a story RON file with orbit_runtime. Native and web."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["showcase", "3d", "script"]
# The renderer demo (`--demo`) and the UI gallery (`--ui-gallery`): development
# tools, left out of the player templates used to export games.
showcase = []
# 3D scenes (ADR 0014): on in the desktop player and the editor. The export
# templates are built without default features; the native one adds `3d`,
# the web one keeps 2D games free of it (M6-13: 3D web template).
3d = ["orbit_runtime/3d"]
# Scripts (ADR 0015, M8-01): the sandboxed Rhai engine. On in the desktop
# player and the editor; the export templates add it to the native and
# Android players and build separate web players with it (`webscript/`,
# and `web3d/`), so that 2D web games without scripts do not carry it.
script = ["orbit_runtime/script"]
# The profiler (F3 overlay, GPU pass timings) in a release build. Debug
# builds always have it; templates (release) never do.
profiling = ["orbit_profile/enabled"]

[dependencies]
orbit_platform.workspace = true
orbit_gfx.workspace = true
orbit_render2d.workspace = true
orbit_text.workspace = true
orbit_audio.workspace = true
orbit_assets.workspace = true
orbit_runtime.workspace = true
orbit_ui.workspace = true
orbit_profile.workspace = true
log.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["Window", "Location"] }
js-sys.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true
