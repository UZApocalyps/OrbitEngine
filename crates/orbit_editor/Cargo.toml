[package]
name = "orbit_editor"
description = "OrbitEngine editor (native, Windows and Linux): egui on the shared wgpu device, plugin host, dock, command palette, projects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "orbit_editor"
path = "src/lib.rs"

[[bin]]
name = "orbit-editor"
path = "src/main.rs"

[dependencies]
orbit_core.workspace = true
orbit_anim.workspace = true
orbit_project.workspace = true
orbit_layers.workspace = true
orbit_script.workspace = true
orbit_dsl.workspace = true
orbit_plugin_api.workspace = true
orbit_editor_api.workspace = true
orbit_platform.workspace = true
orbit_gfx.workspace = true
orbit_render2d.workspace = true
orbit_runtime = { workspace = true, features = ["3d", "script"] }
orbit_vm.workspace = true
orbit_save.workspace = true
orbit_assets.workspace = true
orbit_audio.workspace = true
orbit_export.workspace = true
orbit_i18n.workspace = true
orbit_mcp.workspace = true
# The AI studio (pitch -> LLM story -> images -> project). Editor only.
orbit_ai_studio = { workspace = true, optional = true }
orbit_ui.workspace = true
orbit_render3d.workspace = true
orbit_scene = { path = "../orbit_scene" }
orbit_text.workspace = true
# The editor is never shipped to players: always profiled (TL-04).
orbit_profile = { workspace = true, features = ["enabled"] }
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
egui-snarl.workspace = true
egui-phosphor.workspace = true
rfd.workspace = true
serde.workspace = true
ron.workspace = true
log.workspace = true
env_logger.workspace = true
image = { workspace = true, features = ["jpeg", "gif"] }
pollster.workspace = true
serde_json = "1"
# Constrained Delaunay triangulation for rig meshes (ADR 0013, editor only).
spade = "2.15"

[features]
default = ["ai-studio"]
# The AI studio panel and its MCP tools (`orbit_ai_studio`).
ai-studio = ["dep:orbit_ai_studio"]

[dev-dependencies]
hound.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true

# Installers (cargo-packager, MIT / Apache-2.0): MSI (WiX) and NSIS on Windows,
# AppImage and .deb on Linux. See docs/premiers-pas.md and ADR 0009 section 8.
# The version is the workspace package version. Paths are relative to this
# crate: `cargo build --release -p orbit_editor`, then `cargo packager
# --release` from this folder.
[package.metadata.packager]
product-name = "OrbitEngine Editor"
identifier = "dev.orbitengine.editor"
description = "OrbitEngine editor: write visual novels without code."
long-description = "Native editor of the OrbitEngine visual novel engine: scene and graph editors, asset library, live preview and MCP."
authors = ["OrbitEngine contributors"]
category = "DeveloperTool"
out-dir = "../../target/packager"
binaries-dir = "../../target/release"
binaries = [{ path = "orbit-editor", main = true }]
icons = [
    "../../assets/brand/icon.ico",
    "../../assets/brand/icon-32.png",
    "../../assets/brand/icon-64.png",
    "../../assets/brand/icon-256.png",
]
# Next to the executable: the demo project and its assets, and the (possibly
# empty) `templates/` folder where the game player templates go.
resources = [
    { src = "../../examples/stories", target = "examples/stories" },
    { src = "../../assets/demo", target = "assets/demo" },
    { src = "../../packaging/templates", target = "templates" },
]

# `.orbit` story files (TL-02): registry keys + ProgID on Windows (MSI and
# NSIS), `.desktop` MimeType + shared-mime-info type on Linux (deb and
# AppImage). Double-click runs `orbit-editor <file>`, which opens the project.
# No dedicated document icon yet: the application icon is used (TODO_LATER).
[[package.metadata.packager.file-associations]]
extensions = ["orbit"]
mime-type = "application/x-orbit-story"
description = "OrbitEngine story"
name = "OrbitEngine story"
role = "editor"

[package.metadata.packager.nsis]
installer-icon = "../../assets/brand/icon.ico"
installer-mode = "both"
languages = ["French", "English"]

[package.metadata.packager.deb]
depends = ["libvulkan1", "libxkbcommon0", "libwayland-client0", "libx11-6"]
section = "devel"
