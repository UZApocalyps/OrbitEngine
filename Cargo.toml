[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal
orbit_core = { path = "crates/orbit_core" }
orbit_project = { path = "crates/orbit_project" }
orbit_platform = { path = "crates/orbit_platform" }
orbit_gfx = { path = "crates/orbit_gfx" }
orbit_plugin_api = { path = "crates/orbit_plugin_api" }
orbit_mcp = { path = "crates/orbit_mcp" }
orbit_editor_api = { path = "crates/orbit_editor_api" }

# --- story/vm ---
orbit_vm = { path = "crates/orbit_vm" }

# data / errors
serde = { version = "1", features = ["derive"] }
ron = "0.12"
ulid = { version = "3", default-features = false }
thiserror = "2"

# platform / graphics (versions pinned on purpose, see docs/adr)
winit = "=0.30.13"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
web-time = "1"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# logging / diagnostics
log = "0.4"
env_logger = "0.11"
console_log = "1"
console_error_panic_hook = "0.1"

# web
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# --- presentation ---
orbit_render2d = { path = "crates/orbit_render2d" }
orbit_text = { path = "crates/orbit_text" }
orbit_audio = { path = "crates/orbit_audio" }
orbit_assets = { path = "crates/orbit_assets" }
orbit_ui = { path = "crates/orbit_ui" }
orbit_runtime = { path = "crates/orbit_runtime" }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
unicode-segmentation = "1"
kira = { version = "0.12", default-features = false, features = ["cpal"] }
lewton = "0.10"
hound = "3"
js-sys = "0.3"

# --- m2 logic ---
orbit_save = { path = "crates/orbit_save" }
orbit_i18n = { path = "crates/orbit_i18n" }
postcard = { version = "1", default-features = false, features = ["use-std"] }
base64 = "0.22"
sys-locale = "0.3"
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }

# --- m3 editor (native only: Windows + Linux) ---
# egui is built without `default_fonts` (their license is outside deny.toml):
# the editor ships Inter + the Phosphor icon font itself.
egui = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false, features = ["clipboard", "x11", "wayland"] }
egui-wgpu = { version = "0.36.2", default-features = false }
egui_dock = { version = "0.21.1", features = ["serde"] }
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular"] }
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# egui and wgpu are unusably slow at opt-level 0 (the editor in debug builds).
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
opt-level = 3

[profile.release-wasm]
inherits = "release"
opt-level = "s"
