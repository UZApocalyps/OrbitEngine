[workspace]
resolver = "3"
# `plugins/*` are the official native editor plugins (cdylib, built by
# `cargo xtask plugins`), `examples/editor_plugins/*` the plugin SDK examples:
# neither is in `default-members`, the editor ships without plugins.
members = ["crates/*", "xtask", "examples/plugins/*", "plugins/*", "examples/editor_plugins/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# internal
orbit_core = { path = "crates/orbit_core" }
orbit_anim = { path = "crates/orbit_anim" }
orbit_project = { path = "crates/orbit_project" }
orbit_platform = { path = "crates/orbit_platform" }
orbit_gfx = { path = "crates/orbit_gfx" }
orbit_plugin_api = { path = "crates/orbit_plugin_api" }
orbit_mcp = { path = "crates/orbit_mcp" }
orbit_layers = { path = "crates/orbit_layers" }
orbit_editor_api = { path = "crates/orbit_editor_api" }
orbit_plugin_host = { path = "crates/orbit_plugin_host" }
orbit_editor_sdk = { path = "crates/orbit_editor_sdk" }
orbit_pak = { path = "crates/orbit_pak" }
orbit_export = { path = "crates/orbit_export" }
orbit_dsl = { path = "crates/orbit_dsl" }
orbit_renpy = { path = "crates/orbit_renpy" }
orbit_profile = { path = "crates/orbit_profile" }
orbit_ai_studio = { path = "crates/orbit_ai_studio" }
orbit_sign = { path = "crates/orbit_sign" }
orbit_http = { path = "crates/orbit_http" }
orbit_plugin_store = { path = "crates/orbit_plugin_store" }

# --- story/vm ---
orbit_vm = { path = "crates/orbit_vm" }
orbit_script = { path = "crates/orbit_script" }

# data / errors
serde = { version = "1", features = ["derive"] }
ron = "0.12"
ulid = { version = "3", default-features = false }
thiserror = "2"

# platform / graphics (versions pinned on purpose, see docs/adr)
gilrs = "0.11.2"
# screen readers (ADR 0017): accesskit 0.24 is the version egui already uses
accesskit = "0.24"
accesskit_winit = { version = "0.32", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
winit = "=0.30.13"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
web-time = "1"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# logging / diagnostics
log = "0.4"
env_logger = "0.11"
console_log = "1"
console_error_panic_hook = "0.1"

# web
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# --- presentation ---
orbit_render2d = { path = "crates/orbit_render2d" }
orbit_text = { path = "crates/orbit_text" }
orbit_audio = { path = "crates/orbit_audio" }
orbit_assets = { path = "crates/orbit_assets" }
orbit_ui = { path = "crates/orbit_ui" }
orbit_ui_data = { path = "crates/orbit_ui_data" }
orbit_runtime = { path = "crates/orbit_runtime" }
orbit_render3d = { path = "crates/orbit_render3d" }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
unicode-segmentation = "1"
kira = { version = "0.12", default-features = false, features = ["cpal"] }
lewton = "0.10"
hound = "3"
js-sys = "0.3"

# --- m2 logic ---
orbit_save = { path = "crates/orbit_save" }
orbit_i18n = { path = "crates/orbit_i18n" }
postcard = { version = "1", default-features = false, features = ["use-std"] }
base64 = "0.22"
sys-locale = "0.3"
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }

# --- m3 editor (native only: Windows + Linux) ---
# egui is built without `default_fonts` (their license is outside deny.toml):
# the editor ships Inter + the Phosphor icon font itself.
# egui is pinned exactly: native editor plugins (DLL) share egui types with
# the editor and must be built against the very same version (the plugin
# fingerprint carries it, see orbit_editor_api/src/native.rs).
egui = { version = "=0.36.2", default-features = false }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "x11", "wayland"] }
egui-wgpu = { version = "=0.36.2", default-features = false }
# Native editor plugins: loading of the plugin libraries (orbit_plugin_host).
libloading = "0.8.9"
egui_dock = { version = "0.21.1", features = ["serde"] }
egui-phosphor = { version = "0.14.0", default-features = false, features = ["regular"] }
rfd = "0.17"
egui-snarl = { version = "0.12", default-features = false, features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# egui and wgpu are unusably slow at opt-level 0 (the editor in debug builds).
[profile.dev.package."*"]
opt-level = 1

# The editor's compute-heavy pure code (rig trace / triangulation / weights /
# inpaint, layered file decoding) is 5-10x slower at opt-level 0, which made
# debug builds of the editor crawl on real pictures. Optimized in dev too;
# `"*"` above only covers dependencies, not workspace members.
[profile.dev.package.orbit_project]
opt-level = 2

[profile.dev.package.orbit_layers]
opt-level = 2

[profile.release]
lto = "thin"
opt-level = 3

# The player templates (`cargo xtask templates`): smallest wasm first.
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Vendored egui-snarl 0.12.0, unmodified except for its Cargo.toml: egui is
# depended on with default-features = false (upstream enables egui default_fonts,
# whose OFL / UFL fonts are outside deny.toml). See vendor/egui-snarl/VENDORED.md.
[patch.crates-io]
egui-snarl = { path = "vendor/egui-snarl" }
egui-scale = { path = "vendor/egui-scale" }
