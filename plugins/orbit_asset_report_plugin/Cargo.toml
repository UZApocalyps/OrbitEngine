[package]
name = "orbit_asset_report_plugin"
description = "Asset report, an official native editor plugin (cdylib): unreferenced and undeclared assets, size per asset and per type, biggest files, CSV export. Read-only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The plugin SDK: editor API, the editor's egui and dependency resolution.
orbit_editor_sdk.workspace = true
# Translations (their voices reference sound assets).
orbit_i18n.workspace = true

# `export_plugin!` generates `#[no_mangle]` functions: `unsafe_code` is denied
# here rather than forbidden (the workspace forbids it).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
