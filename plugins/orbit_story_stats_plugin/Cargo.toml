[package]
name = "orbit_story_stats_plugin"
description = "Story statistics panel (scenes, words, lines per character, choices, reading time, voice coverage, CSV export): official native editor plugin, read-only on the project."
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The plugin SDK only: editor API, the editor's egui, the project crates.
orbit_editor_sdk.workspace = true

# `export_plugin!` generates `#[no_mangle]` functions: `unsafe_code` is denied
# here rather than forbidden (the workspace forbids it).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
